name: X public parity probe

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe exact published IRith queries without auth_token
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { ClientTransaction, fetchXDocument } from "x-client-transaction-id";

          const bearer = "AAAAAAAAAAAAAAAAAAAAANRILgAAAAAAnNwIzUejRCOuH5E6I8xnZz4puTs%3D1Zv7ttfk8LF81IUq16cHjhLTvJu4FA33AGWWjCpTnA";
          const ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36";

          const guestRes = await fetch("https://api.twitter.com/1.1/guest/activate.json", {
            method: "POST",
            headers: {
              authorization: "Bearer " + bearer,
              "content-type": "application/x-www-form-urlencoded",
              "user-agent": ua
            }
          });
          console.log("guest_status=" + guestRes.status);
          if (!guestRes.ok) process.exit(2);
          const {guest_token} = await guestRes.json();

          const doc = await fetchXDocument();
          const ct = await ClientTransaction.create(doc);
          const path = "/graphql/k5XapwcSikNsEsILW5FvgA/UserByScreenName";
          const tx = await ct.generateTransactionId("GET", path);
          const u = new URL("https://api.twitter.com" + path);
          u.searchParams.set("variables", JSON.stringify({
            screen_name: "X",
            withSafetyModeUserFields: true
          }));
          u.searchParams.set("features", JSON.stringify({
            hidden_profile_likes_enabled: true,
            hidden_profile_subscriptions_enabled: true,
            responsive_web_graphql_exclude_directive_enabled: true,
            verified_phone_label_enabled: false,
            subscriptions_verification_info_is_identity_verified_enabled: true,
            subscriptions_verification_info_verified_since_enabled: true,
            highlights_tweets_tab_ui_enabled: true,
            responsive_web_twitter_article_notes_tab_enabled: true,
            creator_subscriptions_tweet_preview_api_enabled: true,
            responsive_web_graphql_skip_user_profile_image_extensions_enabled: false,
            responsive_web_graphql_timeline_navigation_enabled: true
          }));
          u.searchParams.set("fieldToggles", JSON.stringify({
            withAuxiliaryUserLabels: false
          }));

          const res = await fetch(u, {
            headers: {
              authorization: "Bearer " + bearer,
              "sec-ch-ua": '"Google Chrome";v="135", "Not-A.Brand";v="8", "Chromium";v="135"',
              "sec-ch-ua-mobile": "?0",
              "sec-ch-ua-platform": '"Windows"',
              "sec-fetch-dest": "empty",
              "sec-fetch-mode": "cors",
              "sec-fetch-site": "same-origin",
              "sec-gpc": "1",
              "user-agent": ua,
              "x-client-transaction-id": tx,
              "x-guest-token": guest_token,
              "x-twitter-active-user": "yes",
              "x-twitter-client-language": "ja"
            }
          });
          console.log("user_status=" + res.status);
          const text = await res.text();
          console.log("user_body_kind=" + (text.includes('"data"') ? "data" : text.slice(0,120)));
          if (!res.ok) process.exit(3);
          NODE
