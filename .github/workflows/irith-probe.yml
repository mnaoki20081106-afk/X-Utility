name: IRith API probe

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public checker contract
        shell: bash
        run: |
          node <<'NODE'
          const crypto = await import("node:crypto");
          const base = "https://irith.io";
          const headers = {
            "content-type": "application/json",
            "accept": "application/json, text/plain, */*",
            "accept-language": "ja,en-US;q=0.9,en;q=0.8",
            "origin": "https://irith.io",
            "referer": "https://irith.io/",
            "sec-fetch-site": "same-origin",
            "sec-fetch-mode": "cors",
            "sec-fetch-dest": "empty",
            "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36"
          };
          const visitRes = await fetch(base + "/", {
            headers: {
              "accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "accept-language": headers["accept-language"],
              "sec-fetch-site": "none",
              "sec-fetch-mode": "navigate",
              "sec-fetch-dest": "document",
              "user-agent": headers["user-agent"]
            },
            redirect: "follow"
          });
          console.log("visit_status=" + visitRes.status);
          const setCookies = typeof visitRes.headers.getSetCookie === "function"
            ? visitRes.headers.getSetCookie()
            : [visitRes.headers.get("set-cookie")].filter(Boolean);
          console.log("visit_cookie_names=" + setCookies.map(x => x.split("=",1)[0]).join(","));
          const cookie = setCookies.map(x => x.split(";")[0]).join("; ");

          const challengeRes = await fetch(base + "/api/auth/challenge", {
            method: "POST",
            headers: { ...headers, cookie },
            body: "{}"
          });
          console.log("challenge_status=" + challengeRes.status);
          if (!challengeRes.ok) {
            console.log((await challengeRes.text()).slice(0,200));
            process.exit(2);
          }
          const ch = await challengeRes.json();
          console.log("challenge_keys=" + Object.keys(ch).sort().join(","));
          console.log("difficulty=" + ch.difficulty);

          function valid(hex, bits) {
            const whole = Math.floor(bits / 4);
            for (let i=0;i<whole;i++) if (hex[i] !== "0") return false;
            const rest = bits % 4;
            return rest === 0 || parseInt(hex[whole], 16) < (1 << (4-rest));
          }

          let nonce;
          for (;;) {
            nonce = crypto.randomBytes(8).toString("hex");
            const digest = crypto.createHash("sha256")
              .update(ch.challenge + "|" + nonce).digest("hex");
            if (valid(digest, ch.difficulty)) break;
          }
          const age = Date.now() - ch.ts;
          if (age < 250) await new Promise(r => setTimeout(r, 250-age));

          const tokenRes = await fetch(base + "/api/auth/token", {
            method: "POST",
            headers,
            body: JSON.stringify({
              challenge: ch.challenge,
              ts: ch.ts,
              sig: ch.sig,
              nonce
            })
          });
          console.log("token_status=" + tokenRes.status);
          if (!tokenRes.ok) {
            console.log((await tokenRes.text()).slice(0,200));
            process.exit(3);
          }
          const tok = await tokenRes.json();
          console.log("token_keys=" + Object.keys(tok).sort().join(","));

          const checkRes = await fetch(base + "/api/shadowban?screen_name=github", {
            headers: {
              ...headers,
              "x-session-token": tok.token
            }
          });
          console.log("shadowban_status=" + checkRes.status);
          if (!checkRes.ok) {
            console.log((await checkRes.text()).slice(0,200));
            process.exit(4);
          }
          const data = await checkRes.json();
          console.log("shadowban_keys=" + Object.keys(data).sort().join(","));
          console.log("user_type=" + (data.user?.__typename ?? "null"));
          for (const k of ["media_ban","search_sensitive_ban","search_suggestion_ban","search_ban","ghost_ban","reply_deboosting","protect","no_tweet","no_reply"]) {
            console.log(k + "_type=" + typeof data[k]);
          }
          NODE
